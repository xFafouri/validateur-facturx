name: Release

# Builds and publishes both container images, then waits for a human before anything is deployed.
#
# Deliberately split from CI: CI proves the code is good, this ships it. The `deploy` job is gated
# on a GitHub Environment with a required reviewer, so a merge can never put something live on its
# own — deploying is an explicit decision, especially for a service handling tax documents.
#
# The deploy step itself is left as a placeholder because the hosting target is still open. It must
# be an EU region: French invoices carry personal and commercial data in scope for GDPR, and the
# archiving obligation assumes EU residency.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.0'

jobs:
  # Never publish an image from a commit whose tests have not passed.
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @facturx/db generate
      - run: pnpm --filter @facturx/core build
      - run: pnpm --filter @facturx/auth build
      - run: pnpm --filter @facturx/mail build
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  images:
    name: Build and push images
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: validator
            context: ./services/validator
            dockerfile: ./services/validator/Dockerfile
          - name: web
            context: .
            dockerfile: ./apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_ALLOW_INDEXING=${{ vars.NEXT_PUBLIC_ALLOW_INDEXING }}

  # Smoke-tests the published web image against a real validator before anyone is asked to approve
  # a deploy. Catches an image that builds but cannot actually validate an invoice.
  smoke:
    name: Smoke-test published images
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start validator
        run: |
          docker build -t validator:smoke services/validator
          docker run -d --name validator -p 8081:8081 validator:smoke
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8081/health | grep -q '"warmedUp":true' && exit 0
            sleep 1
          done
          echo "validator failed to warm up"; docker logs validator; exit 1

      - name: Start web
        run: |
          docker build -f apps/web/Dockerfile -t web:smoke .
          docker run -d --name web --network host -e VALIDATOR_URL=http://127.0.0.1:8081 web:smoke
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/valider >/dev/null && exit 0
            sleep 1
          done
          echo "web failed to start"; docker logs web; exit 1

      - name: Validate a known-bad invoice end to end
        run: |
          # A document whose line total contradicts its lines must come back non-conforme with
          # BR-CO-10. If this passes, the whole pipeline is wired correctly.
          cat > /tmp/broken.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <rsm:CrossIndustryInvoice xmlns:rsm="urn:un:unece:uncefact:data:standard:CrossIndustryInvoice:100" xmlns:ram="urn:un:unece:uncefact:data:standard:ReusableAggregateBusinessInformationEntity:100" xmlns:udt="urn:un:unece:uncefact:data:standard:UnqualifiedDataType:100">
            <rsm:ExchangedDocumentContext><ram:GuidelineSpecifiedDocumentContextParameter><ram:ID>urn:cen.eu:en16931:2017#compliant#urn:factur-x.eu:1p0:basic</ram:ID></ram:GuidelineSpecifiedDocumentContextParameter></rsm:ExchangedDocumentContext>
            <rsm:ExchangedDocument><ram:ID>SMOKE-1</ram:ID><ram:TypeCode>380</ram:TypeCode><ram:IssueDateTime><udt:DateTimeString format="102">20260901</udt:DateTimeString></ram:IssueDateTime></rsm:ExchangedDocument>
            <rsm:SupplyChainTradeTransaction>
              <ram:IncludedSupplyChainTradeLineItem>
                <ram:AssociatedDocumentLineDocument><ram:LineID>1</ram:LineID></ram:AssociatedDocumentLineDocument>
                <ram:SpecifiedTradeProduct><ram:Name>Test</ram:Name></ram:SpecifiedTradeProduct>
                <ram:SpecifiedLineTradeAgreement><ram:NetPriceProductTradePrice><ram:ChargeAmount>100.00</ram:ChargeAmount></ram:NetPriceProductTradePrice></ram:SpecifiedLineTradeAgreement>
                <ram:SpecifiedLineTradeDelivery><ram:BilledQuantity unitCode="C62">1</ram:BilledQuantity></ram:SpecifiedLineTradeDelivery>
                <ram:SpecifiedLineTradeSettlement><ram:ApplicableTradeTax><ram:TypeCode>VAT</ram:TypeCode><ram:CategoryCode>S</ram:CategoryCode><ram:RateApplicablePercent>20.00</ram:RateApplicablePercent></ram:ApplicableTradeTax><ram:SpecifiedTradeSettlementLineMonetarySummation><ram:LineTotalAmount>100.00</ram:LineTotalAmount></ram:SpecifiedTradeSettlementLineMonetarySummation></ram:SpecifiedLineTradeSettlement>
              </ram:IncludedSupplyChainTradeLineItem>
              <ram:ApplicableHeaderTradeAgreement>
                <ram:SellerTradeParty><ram:Name>Test SARL</ram:Name><ram:PostalTradeAddress><ram:CountryID>FR</ram:CountryID></ram:PostalTradeAddress><ram:SpecifiedTaxRegistration><ram:ID schemeID="VA">FR38552081317</ram:ID></ram:SpecifiedTaxRegistration></ram:SellerTradeParty>
                <ram:BuyerTradeParty><ram:Name>Client SAS</ram:Name><ram:PostalTradeAddress><ram:CountryID>FR</ram:CountryID></ram:PostalTradeAddress></ram:BuyerTradeParty>
              </ram:ApplicableHeaderTradeAgreement>
              <ram:ApplicableHeaderTradeDelivery/>
              <ram:ApplicableHeaderTradeSettlement>
                <ram:InvoiceCurrencyCode>EUR</ram:InvoiceCurrencyCode>
                <ram:ApplicableTradeTax><ram:CalculatedAmount>40.00</ram:CalculatedAmount><ram:TypeCode>VAT</ram:TypeCode><ram:BasisAmount>200.00</ram:BasisAmount><ram:CategoryCode>S</ram:CategoryCode><ram:RateApplicablePercent>20.00</ram:RateApplicablePercent></ram:ApplicableTradeTax>
                <ram:SpecifiedTradeSettlementHeaderMonetarySummation><ram:LineTotalAmount>200.00</ram:LineTotalAmount><ram:TaxBasisTotalAmount>200.00</ram:TaxBasisTotalAmount><ram:TaxTotalAmount currencyID="EUR">40.00</ram:TaxTotalAmount><ram:GrandTotalAmount>240.00</ram:GrandTotalAmount><ram:DuePayableAmount>240.00</ram:DuePayableAmount></ram:SpecifiedTradeSettlementHeaderMonetarySummation>
              </ram:ApplicableHeaderTradeSettlement>
            </rsm:SupplyChainTradeTransaction>
          </rsm:CrossIndustryInvoice>
          XML

          response=$(curl -sS -X POST -F "fichier=@/tmp/broken.xml" http://127.0.0.1:3000/api/valider)
          echo "$response" | head -c 400; echo

          echo "$response" | grep -q '"verdict":"non-conforme"' || { echo "FAIL: expected non-conforme"; exit 1; }
          echo "$response" | grep -q 'BR-CO-10' || { echo "FAIL: expected BR-CO-10"; exit 1; }
          echo "smoke test passed"

      - name: Logs on failure
        if: failure()
        run: docker logs validator; docker logs web

  deploy:
    name: Deploy
    needs: smoke
    runs-on: ubuntu-latest
    # Requires a reviewer configured on the environment. Nothing reaches users without a person
    # approving it.
    environment:
      name: ${{ inputs.environment || 'production' }}
    steps:
      - name: Deploy
        run: |
          echo "Images are built, smoke-tested and published."
          echo
          echo "The deploy step is intentionally not implemented: the hosting target is still open."
          echo "Whatever is chosen MUST be an EU region - GDPR and the archiving obligation."
          echo
          echo "To complete this job, add the provider's deploy action here and set:"
          echo "  vars.NEXT_PUBLIC_SITE_URL       public URL"
          echo "  vars.NEXT_PUBLIC_ALLOW_INDEXING 'true' for production only"
          echo "  secrets.DATABASE_URL            EU-hosted Postgres"
          exit 1
